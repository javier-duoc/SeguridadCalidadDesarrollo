<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Agenda de citas')}"></head>

<body>
<header th:replace="~{fragments/layout :: barra}"></header>

<main class="contenido">

    <div class="encabezado-seccion">
        <h1>Agenda de citas</h1>
        <a sec:authorize="hasAnyRole('ADMIN','RECEPCION')"
           class="boton" th:href="@{/citas/nueva}">+ Programar cita</a>
    </div>

    <p class="aviso ok" th:if="${mensaje}" th:text="${mensaje}"></p>

    <table class="tabla">
        <thead>
        <tr>
            <th>#</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Paciente</th>
            <th>Motivo de consulta</th>
            <th>Veterinario asignado</th>
            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${veterinarios}">
    <td th:text="${v.id}">1</td>
    <td th:text="${v.nombre}">Dra. Carla Munoz</td>
    <td th:text="${v.especialidad}">Medicina general</td>
</tr>
<tr th:each="v : ${veterinarios}">
    <td th:text="${v.id}">2</td>
    <td th:text="${v.nombre}">Dr. Luis Herrera</td>
    <td th:text="${v.especialidad}">Cirugia</td>
</tr>
<tr th:each="v : ${veterinarios}">
    <td th:text="${v.id}">3</td>
    <td th:text="${v.nombre}">Dra. Paula Vidal</td>
    <td th:text="${v.especialidad}">Dermatologia</td>
</tr>
                <form th:action="@{'/citas/' + ${cita.id} + '/eliminar'}" method="post">
                    <button type="submit" class="boton boton-peligro">Cancelar</button>
                </form>
            </td>
        </tr>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
